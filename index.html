<script>
(function(){
  const D = JSON.parse(document.getElementById('datos').textContent);
  const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const app = document.getElementById('app');

  // Fecha de hoy. Para revisar otra fecha: agregar #hoy-2026-10-05 al final del link.
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function parse(s){ const [y,m,d]=s.slice(0,10).split('-').map(Number); return new Date(y,m-1,d); }
  function add(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
  const mh = location.hash.match(/^#hoy-(\d{4}-\d{2}-\d{2})$/);
  const HOY = mh ? parse(mh[1]) : parse(iso(new Date()));
  const hoyISO = iso(HOY);
  const lunes = add(HOY, -((HOY.getDay()+6)%7));
  const L1 = iso(add(lunes,7)), L2 = iso(add(lunes,14));
  const F15 = iso(add(HOY,15)), F22 = iso(add(HOY,22));   // 15 días: hoy + 14; radar: días 16 a 22

  function largo(s){ const d=parse(s); return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]; }
  function selloTxt(ts){ if(!ts) return ''; const d=new Date(ts); return largo(ts)+' a las '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
  function mayus(t){ return t.charAt(0).toUpperCase()+t.slice(1); }
  function relativo(s){ if(s===hoyISO) return 'Hoy'; if(s===iso(add(HOY,1))) return 'Mañana'; return ''; }
  function horas(min){ if(!min) return ''; const h=Math.floor(min/60), r=min%60; return (h? h+(h===1?' hora':' horas'):'') + (h&&r?' y ':'') + (r? r+' minutos':''); }
  function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  function slug(t){ return t.normalize('NFD').replace(/[^\x00-\x7F]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
  function nombres(t){ return (t||'').split(/\n|,/).map(s=>s.trim()).filter(Boolean).join(', '); }
  const anclaSes = (fecha, faro) => 's-'+fecha+'-'+slug(faro);

  const TIPOS = {
    'decisión': {chip:'Se decide', cls:'t-decision', txt:'Se pedirá al FARO tomar una decisión.'},
    'discusión': {chip:'Se pide opinión', cls:'t-opinion', txt:'Se pedirá la opinión del FARO para orientar el trabajo.'},
    'informativo': {chip:'Para enterarse', cls:'t-info', txt:'Solo se informa.'}
  };
  function tipo(t){ return TIPOS[(t||'').toLowerCase()] || {chip:'Tipo por definir', cls:'t-def', txt:'El capitán todavía no indica si es para decidir, opinar o informar.'}; }
  const estrategico = t => ['decisión','discusión'].includes((t||'').toLowerCase());
  function notasDe(it){ return (D.notas||[]).filter(n => n.faro===it.faro && it.tema.toLowerCase().startsWith(n.tema.toLowerCase()) && hoyISO <= (n.hasta||'9999')); }

  // Cambios vigentes para resaltar: los de las revisiones de los últimos N días
  const limite = iso(add(HOY, -(D.dias_resalte||3)));
  const vigentes = (D.registro||[]).filter(r => r.revision.slice(0,10) >= limite && r.revision.slice(0,10) <= hoyISO);
  const porClave = {}, sesCambio = [], retirados = [];
  vigentes.forEach(r => r.cambios.forEach(c => {
    const conFecha = Object.assign({rev:r.revision}, c);
    if (c.tipo==='nuevo' || c.tipo==='modificado') (porClave[c.clave] = porClave[c.clave] || []).push(conFecha);
    if (c.tipo==='sesion') sesCambio.push(conFecha);
    if (c.tipo==='retirado') retirados.push(conFecha);
    if (c.fantasma) retirados.push(Object.assign({}, conFecha, c.fantasma, {clave:'~'+c.clave, sinFecha:true}));
  }));

  // Temas, más renglones fantasma: retirados y sesiones que solo están en Decisions
  const items = (D.items||[]).filter(i => i.fecha).map(i => Object.assign({}, i));
  retirados.forEach(c => { if (!items.some(i=>i._k===c.clave)) items.push({faro:c.faro, fecha:c.fecha, tema:c.tema, _retirado:c}); });
  const decPorSes = {};
  (D.decisions||[]).forEach(s => { decPorSes[s.fecha+'|'+s.faro] = s; });
  Object.values(decPorSes).forEach(s => { if (!items.some(i=>i.fecha===s.fecha && i.faro===s.faro)) items.push({faro:s.faro, fecha:s.fecha, tema:'Sin temas todavía', _soloDec:true}); });
  (D.confidenciales||[]).forEach(s => { items.push({faro:s.faro, fecha:s.fecha, tema:s.etiqueta||'Agenda confidencial', _soloDec:true, _conf:s}); });
  (D.sesiones_outlook||[]).forEach(s => { if (!items.some(i=>i.fecha===s.fecha && i.faro===s.faro)) items.push({faro:s.faro, fecha:s.fecha, tema:s.extraordinaria ? 'Sesión extraordinaria, sin temas registrados' : 'Sin temas todavía', _soloDec:true, _cal:s}); });
  const reales = items.filter(i => !i._retirado && !i._soloDec);
  const enRango = (arr,a,b) => arr.filter(i => i.fecha>=a && i.fecha<b);

  function sesiones(arr){
    const map = new Map();
    arr.forEach(i => { const k=i.fecha+'|'+i.faro; if(!map.has(k)) map.set(k,{fecha:i.fecha, faro:i.faro, items:[]}); map.get(k).items.push(i); });
    return [...map.values()].sort((a,b)=> a.fecha.localeCompare(b.fecha) || ((a.items.find(i=>i.hora)||{}).hora||'').localeCompare((b.items.find(i=>i.hora)||{}).hora||'') || a.faro.localeCompare(b.faro));
  }
  function cambiosDeSesion(s){ return sesCambio.filter(c => c.faro===s.faro && c.fecha===s.fecha || (c.claves||[]).some(k=>s.items.some(i=>i._k===k))); }
  function sesionCambio(s){ return cambiosDeSesion(s).length || s.items.some(i => i._retirado || porClave[i._k]); }

  // Encabezado: hoy, sello de revisión y fuentes
  const hoyP = document.getElementById('hoy');
  hoyP.append('Hoy es ', el('strong', null, largo(hoyISO)), '.');
  // Leyenda de frescura (29-oct-2026): de un vistazo, si la página y las respuestas de Outlook están al día
  (function(){
    if (!D.generado) return;
    const g = new Date(D.generado), h12 = d => { const h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0'); return ((h%12)||12)+':'+m+(h<12?' a. m.':' p. m.'); };
    const hoyReal = iso(new Date()), gDia = D.generado.slice(0,10);
    const p = el('p','actualizado'); p.append(el('b',null,'Última actualización: '), largo(gDia)+', '+h12(g));
    const hs = (D.quorum||[]).filter(q => q.respuestas_reales && typeof q.actualizado_hace_horas==='number').map(q => q.actualizado_hace_horas);
    let chip;
    if (gDia !== hoyReal && !mh) chip = el('span','chip c-alerta','No es de hoy');
    else if (!hs.length) chip = el('span','chip c-tent','Respuestas de Outlook sin leer');
    else {
      const lect = new Date(g.getTime() - Math.min(...hs)*3600000), hace = Math.round((Date.now() - lect.getTime())/3600000);
      p.append(' · Respuestas de Outlook leídas '+(iso(lect)===gDia ? 'hoy' : largo(iso(lect)))+' a las '+h12(lect));
      chip = hace > 30 ? el('span','chip c-alerta','Respuestas desactualizadas (hace '+hace+' h)') : hace > 14 ? el('span','chip c-tent','Respuestas de ayer (hace '+hace+' h)') : el('span','chip q-ok','Al día');
    }
    p.append(' ', chip); hoyP.after(p);
  })();
  if (D.generado && !mh && D.generado.slice(0,10) !== iso(new Date())){ const ac=el('p','sub','Esta copia se generó el '+largo(D.generado.slice(0,10))+'. Para ver la agenda vigente abra '+(D.url||'el link de la agenda')+'.'); ac.style.fontWeight='700'; hoyP.after(ac); }
  // PDF: lo genera la rutina en OneDrive; el botón aparece solo si hay link compartido (PDF_URL.txt)
  if (D.pdf_url){ const pp=el('p','pdf'); const pa=el('a','copiar','Descargar en PDF'); pa.href=D.pdf_url; pa.target='_blank'; pa.rel='noopener'; pp.append(pa); if (D.html_url){ const ha=el('a','copiar','Descargar HTML interactivo'); ha.href=D.html_url; ha.target='_blank'; ha.rel='noopener'; pp.append(ha); } window.__pdfp = pp; }
  // Cambios para los próximos días (solo sesiones de hoy en adelante)
  const C = D.cambios || {lista:[]};
  const bc = el('section','box cambios'); bc.id='cambios'; bc.setAttribute('aria-labelledby','t-camb');
  const hc = el('h2', null, 'Actualización del '+largo(hoyISO)); hc.id='t-camb';
  bc.append(hc);
  const renglon = c => { const r=relativo(c.fecha); return (r? r+', '+largo(c.fecha) : mayus(largo(c.fecha)))+' · '+c.faro+': '+c.corto; };
  const vistoR = new Set();
  const prox_c = (C.lista||[]).filter(c => c.fecha && c.fecha >= hoyISO && c.corto).sort((a,b)=>a.fecha.localeCompare(b.fecha)).filter(c => { const k=renglon(c); if (vistoR.has(k)) return false; vistoR.add(k); return true; });
  if (prox_c.length){
    const ul = el('ul');
    prox_c.forEach(c => { const li=el('li'); const a=el('a', null, renglon(c)); a.href='#'+anclaSes(c.fecha, c.faro); li.append(a); ul.append(li); });
    bc.append(ul);
  } else {
    bc.append(el('p','sin','Sin cambios en la agenda de los próximos días.'));
  }
  const nota0 = 'Agenda de FAROs · *actualización del '+largo(hoyISO)+'*\n\n'
    + (prox_c.length ? prox_c.map(c=>'• '+renglon(c)).join('\n') : 'Sin cambios en la agenda de los próximos días.')
    + ((D.pages_url||D.html_url||D.url) ? '\n\n'+(D.pages_url ? 'Ver la agenda completa: ' : D.html_url ? 'Ver la agenda interactiva: ' : 'Ver la agenda completa: ')+(D.pages_url||D.html_url||D.url) : '');
  // la nota que se pega en WhatsApp es la misma que escribe la rutina, sin el quórum (solo lo de hoy), no el resumen de 3 días de la caja (3-nov-2026)
  const nota = (C.nota_corta && C.nota_corta.trim()) ? C.nota_corta : nota0;
  const btn = el('button','copiar','Copiar nota de cambios'); btn.type='button';
  const ta = el('textarea','nota-copia'); ta.value = nota; ta.readOnly = true; ta.hidden = true; ta.id='nota-copia'; ta.setAttribute('aria-label','Nota de cambios para compartir');
  btn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(nota); btn.textContent = 'Nota copiada'; }
    catch(e){ ta.hidden = false; ta.focus(); ta.select(); btn.textContent = 'Seleccionada: copie con Ctrl+C o Cmd+C'; }
    setTimeout(()=>{ btn.textContent='Copiar nota de cambios'; }, 4000);
  });
  bc.append(btn, ta);
  // Resumen de los próximos 15 días
  const prox = enRango(reales, hoyISO, F15);
  const ses15 = sesiones(prox);
  const sesCal = sesiones(enRango(items.filter(i => !i._retirado), hoyISO, F15));
  const conMin = prox.filter(i => i.minutos && TIPOS[(i.tipo||'').toLowerCase()]);
  const tot = conMin.reduce((s,i)=>s+i.minutos,0);
  const est = conMin.filter(i=>estrategico(i.tipo)).reduce((s,i)=>s+i.minutos,0);
  const pct = tot ? Math.round(100*est/tot) : 0;
  const r = el('section','box resumen'); r.setAttribute('aria-labelledby','t-res');
  const rh = el('h2', null, 'Los próximos 15 días'); rh.id='t-res';
  const cif = el('div','cifras');
  [[sesCal.length, sesCal.length===1?'sesión en el calendario':'sesiones en el calendario'],[ses15.length, ses15.length===1?'con temas':'con temas'],[prox.length, prox.length===1?'tema':'temas'],[prox.filter(i=>(i.tipo||'').toLowerCase()==='decisión').length,'decisiones']].forEach(([n,t])=>{ const s=el('span'); s.append(el('b',null,String(n)), t); cif.append(s); });
  r.append(rh, cif);
  if (tot){
    const bar = el('div','barra'); bar.setAttribute('role','img'); bar.setAttribute('aria-label', pct+'% del tiempo es para decidir u opinar; la meta es 70%');
    const fill = el('i'); fill.style.width = pct+'%'; const meta = el('s'); meta.style.left='70%'; bar.append(fill, meta);
    r.append(bar, el('p','barra-txt', pct+'% del tiempo es para decidir u opinar ('+horas(est)+' de '+horas(tot)+'). La línea negra marca la meta de 70%; el resto es para informar y dar seguimiento. No cuenta temas sin tipo o sin duración.'));
    const sinDur = prox.filter(i=>!i.minutos).length, sinTipo = prox.filter(i=>!TIPOS[(i.tipo||'').toLowerCase()]).length;
    const falt=[]; if(sinDur) falt.push(sinDur+(sinDur===1?' tema no tiene':' temas no tienen')+' duración'); if(sinTipo) falt.push(sinTipo+(sinTipo===1?' tema no indica':' temas no indican')+' si es para decidir, opinar o informar');
    if (falt.length) r.append(el('p','sub', 'Por completar: '+falt.join('; ')+'.'));
  }
  app.append(r);

  // Cómo leer
  const ley = el('section','box leyenda'); ley.setAttribute('aria-labelledby','t-ley');
  const lh = el('h2', null, 'Cómo leer cada tema'); lh.id='t-ley'; lh.style.fontSize='1.35rem';
  ley.append(lh);
  ['decisión','discusión','informativo',''].forEach(k=>{ const t=tipo(k); const d=el('div'); d.append(el('span','chip '+t.cls,t.chip), el('span',null,t.txt)); ley.append(d); });
  const dn=el('div'); dn.append(el('span','chip c-nuevo','Nuevo'), el('span',null,'Marca amarilla: el tema es nuevo o algo cambió en los últimos '+(D.dias_resalte||3)+' días. Se indica qué había antes y qué hay ahora.')); ley.append(dn);
  const dr=el('div'); dr.append(el('span','chip c-prio','Tachado'), el('span',null,'El tema se retiró de la agenda.')); ley.append(dr);

  // Quórum: mitad más uno de capitán(es) y miembros (los invitados no cuentan). Listas con comas para ocupar poco espacio.
  function quorumBloque(s){
    const q = (D.quorum||[]).find(x => x.fecha===s.fecha && x.faro===s.faro);
    if (!q) return null;
    const r = q.resumen, det = el('details','quorum');
    const sm = el('summary'); sm.append(el('b',null,'Quórum: '));
    const nec = 'se necesitan '+r.requerido+' de '+r.total;
    sm.append(el('span',null, q.respuestas_reales ? 'confirmados '+r.confirmados+' de '+r.total+'; '+nec+(q.actualizado_hace_horas>12 ? ' · leídas hace '+Math.round(q.actualizado_hace_horas)+' h' : '')
      : nec+(q.sin_acceso ? ' · sin acceso a la invitación: no se puede ver quién asistirá' : ' · respuestas sin leer en Outlook')));
    if (q.alerta) sm.append(el('span','chip c-alerta','Atención: '+q.alerta));
    else if (q.respuestas_reales && q.actualizado_hace_horas>30) sm.append(el('span','chip c-tent','Quórum sin confirmar: respuestas desactualizadas'));
    else if (q.estado) sm.append(el('span', q.estado==='alcanzado' ? 'chip q-ok' : 'chip c-tent', q.estado==='alcanzado' ? 'Quórum alcanzado' : 'Quórum por confirmar'));
    det.append(sm);
    const linea = (etq, lista) => { if (lista && lista.length){ const p = el('p','dato q-linea'); p.append(el('b',null,etq+': '), lista.join(', ')); det.append(p); } };
    const nom = p => p.nombre + (p.capitan ? ' (capitán)' : '');
    const de = est => q.decisores.filter(p => p.estado===est).map(nom);
    if (q.respuestas_reales){
      linea('Aceptaron', de('aceptó')); linea('Tentativos', de('tentativo')); linea('Rechazaron', de('rechazó')); linea('Sin responder', de('sin responder'));
    } else if (q.con_respuestas){
      linea('Convocados', de('invitado'));
    } else {
      linea(q.decisores.filter(p=>p.capitan).length>1 ? 'Capitanes' : 'Capitán', q.decisores.filter(p=>p.capitan).map(p=>p.nombre));
      linea('Miembros ('+q.decisores.filter(p=>!p.capitan).length+')', q.decisores.filter(p=>!p.capitan).map(p=>p.nombre));
    }
    if (q.con_respuestas) linea('Fuera de la invitación', de('no invitado'));
    linea('Invitados recurrentes en la invitación', q.recurrentes);
    linea('Invitados especiales', q.especiales);
    if (q.organizador || (q.apoyo||[]).length){
      const p = el('p','dato q-linea q-apoyo');
      if (q.organizador) p.append(el('b',null,'Convoca: '), q.organizador + ((q.apoyo||[]).length ? '. ' : ''));
      if ((q.apoyo||[]).filter(n => norm1(n)!==norm1(q.organizador||'')).length) p.append(el('b',null,'Apoyo SPMO: '), q.apoyo.filter(n => norm1(n)!==norm1(q.organizador||'')).join(', ') || '');
      det.append(p);
    }
    return det;
  }
  const norm1 = t => (t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  // el PDF y la impresión muestran el quórum desplegado
  window.addEventListener('beforeprint', () => document.querySelectorAll('details.quorum').forEach(d => d.open = true));

  // Tarjeta de sesión
  function tarjeta(s){
    const art = el('article','sesion'); art.id = anclaSes(s.fecha, s.faro);
    const cab = el('div','ses-cab');
    const esNave = /^nave/i.test(s.faro);
    cab.append(el('p','ses-tipo', esNave? 'NAVE · equipo de ejecución' : 'FARO · foro del equipo directivo'));
    cab.append(el('h3', null, s.faro));
    const vivos = s.items.filter(i=>!i._retirado && !i._soloDec);
    const minT = vivos.reduce((a,i)=>a+(i.minutos||0),0);
    const h12 = t => { const [h,m]=String(t).split(':').map(Number); return ((h%12)||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'a. m.':'p. m.'); };
    const rango = (a,b) => { const x=h12(a); if(!b) return x; const y=h12(b); return x.split(' ').slice(1).join(' ')===y.split(' ').slice(1).join(' ') ? x.split(' ')[0]+' a '+y : x+' a '+y; };
    const hh = (D.horarios||[]).find(x => x.fecha===s.fecha && x.faro===s.faro);
    const cfg = (s.items.find(i=>i._conf)||{})._conf; const hora = hh ? rango(hh.inicio, hh.fin) : (cfg && cfg.hora) ? rango(cfg.hora, cfg.fin) : vivos.find(i=>i.hora)?.hora;
    const partes = [mayus(largo(s.fecha))+(hora? ', '+hora : '')];
    if (vivos.length) partes.push(vivos.length+(vivos.length===1?' tema':' temas'));
    if (minT) partes.push(horas(minT)+(vivos.some(i=>!i.minutos)?' conocidos':''));
    cab.append(el('p','ses-meta', partes.join(' · ')));
    art.append(cab);
    const an = (D.anexo||[]).find(x => x.faro===s.faro);
    if (an){ const p=el('p','ses-antec'); const a=el('a',null,'Antecedentes: decisiones previas y juntas anteriores'); a.href='#anexo-'+slug(s.faro); p.append(a); art.append(p); }
    (D.sesiones||[]).filter(x => x.faro===s.faro && x.fecha===s.fecha && hoyISO <= (x.hasta||x.fecha)).forEach(x => { const p=el('p','ses-aviso ses-alerta'); p.append(el('b',null,'Atención: '), x.texto); art.append(p); });
    cambiosDeSesion(s).forEach(c => art.append(el('p','ses-cambio', c.corto ? mayus(c.corto) : c.texto)));
    const qb = quorumBloque(s); if (qb) art.append(qb);
    const ul = el('ul','temas');
    s.items.forEach(i => {
      if (i._conf){ const li=el('li','tema'); const c=el('div','tema-cab'); c.append(el('h4',null,i._conf.etiqueta||'Agenda confidencial'), el('span','chip c-prio','Acceso restringido')); if (i._conf.reprogramar) c.append(el('span','chip c-tent',i._conf.nueva_fecha?'Reprogramada':'Cancelada por reprogramar')); li.append(c); const p=el('p','dato'); if (i._conf.organizador) p.append(el('b',null,'Convoca: '), i._conf.organizador+'. '); if (i._conf.reprogramar) p.append((i._conf.nueva_fecha ? 'Se canceló para reprogramarla: '+(i._conf.organizador||'quien convoca')+' ya envió la nueva invitación para el '+largo(i._conf.nueva_fecha)+(i._conf.nueva_horario?', '+i._conf.nueva_horario:'')+(/\.$/.test(i._conf.nueva_horario||'')?'':'.') : 'Se cancela para reprogramarla: '+(i._conf.organizador||'quien convoca')+' enviará la nueva invitación.')); else if (!i._conf.liga) p.append('La agenda se comparte solo con las personas convocadas.'); if (i._conf.liga){ if (i._conf.reprogramar) p.append(' '); const a=el('a',null,'Abrir la agenda en Decisions (requiere acceso)'); a.href=i._conf.liga; a.target='_blank'; a.rel='noopener noreferrer'; p.append(a); } li.append(p); ul.append(li); return; }
      if (i._soloDec){ const li=el('li','tema'); li.append(el('p','dato',(i._cal && i._cal.extraordinaria) ? 'Sesión extraordinaria, todavía sin temas registrados.' : 'Sesión agendada, todavía sin temas.')); ul.append(li); return; }
      if (i._retirado){ const li=el('li','tema retirado'); const c=el('div','tema-cab'); c.append(el('h4', null, i.tema), el('span','chip c-prio', i._retirado.cancelada ? 'Sesión cancelada' : i._retirado.sinFecha ? 'Salió de esta sesión, queda sin fecha' : 'Se retiró de la agenda')); li.append(c); ul.append(li); return; }
      const cs = porClave[i._k] || [];
      const li = el('li','tema'+(cs.length?' resaltado':'')); const t = tipo(i.tipo);
      const c = el('div','tema-cab');
      c.append(el('h4', null, i.tema));
      if (cs.some(x=>x.tipo==='nuevo')) c.append(el('span','chip c-nuevo','Nuevo'));
      else if (cs.length) c.append(el('span','chip c-nuevo','Cambió'));
      c.append(el('span','chip '+t.cls, t.chip));
      if (i.minutos) c.append(el('span','chip c-prio', i.minutos+' min'));
      if (i.tentativo) c.append(el('span','chip c-tent','Fecha tentativa'));
      if (/cancel/i.test(i.estado||'')) c.append(el('span','chip c-alerta', i.estado));
      else if (i.estado && !/confirmad/i.test(i.estado)) c.append(el('span','chip c-tent', i.estado));
      li.append(c);
      cs.filter(x=>x.tipo==='modificado').forEach(x => {
        const d = el('div','cambio-det');
        (x.campos||[]).forEach(f => { const p=el('span'); p.append(f.campo+': antes ', el('s', null, f.antes), ' · ahora '+f.ahora); d.append(p); });
        li.append(d);
      });
      if (i.pregunta) li.append(el('p','pregunta', i.pregunta));
      if (i.descripcion){ const p=el('p','dato'); p.append(el('b',null,'De qué se trata: '), i.descripcion); li.append(p); }
      if (i.antecedente){ const p=el('p','dato'); p.append(el('b',null,'Antecedente ('+largo(i.antecedente.fecha)+'): '), i.antecedente.texto); li.append(p); }
      if (i.porque){ const p=el('p','dato'); p.append(el('b',null,'Por qué en el FARO: '), i.porque); li.append(p); }
      if (i.responsables){ const p=el('p','dato'); p.append(el('b',null,'Presenta: '), nombres(i.responsables)); li.append(p); }
      if (i.invitados){ const p=el('p','dato'); p.append(el('b',null,'Invitados para este tema: '), nombres(i.invitados)); li.append(p); }
      if (i.prioridad){ const p=el('p','dato'); p.append(el('b',null,'Prioridad 26-27: '), i.prioridad.replace(/^\d+\.\s*/,'')); li.append(p); }
      if (i.conflictos){ const n=el('p','nota alerta'); n.append(el('b',null,'Choque de agenda'), i.conflictos); li.append(n); }
      notasDe(i).forEach(n => { const p=el('p','nota'+(n.nivel==='alerta'?' alerta':'')); p.append(el('b',null, n.nivel==='alerta'?'Atención':'Comentario'), n.texto); li.append(p); });
      ul.append(li);
    });
    art.append(ul);
    return art;
  }

  function bloque(titulo, sub, desde, hasta, tenue){
    const sec = el('section','semana'+(tenue?' tenue':''));
    const cab = el('div','semana-cab');
    cab.append(el('h2', null, titulo), el('p','sub', sub));
    sec.append(cab);
    const ss = sesiones(enRango(items, desde, hasta));
    if (!ss.length){ sec.append(el('p','vacio', D.lista_incompleta ? 'Sin lectura reciente de Outlook: la lista de sesiones de estos días puede estar incompleta.' : 'No hay temas registrados para estos días.')); return sec; }
    const idx = el('ul','indice');
    ss.forEach(s => { const li=el('li'); const a=el('a'); a.href='#'+anclaSes(s.fecha, s.faro); const n=s.items.filter(i=>!i._retirado&&!i._soloDec).length; const esC=s.items.some(i=>i._conf); a.append(el('span','d', mayus(largo(s.fecha))), s.faro+' · '+(esC?'agenda confidencial':n+(n===1?' tema':' temas'))); if (sesionCambio(s)) a.append(el('span','cambio','cambió')); li.append(a); idx.append(li); });
    sec.append(idx);
    let dia = null, cont = null;
    ss.forEach(s => {
      if (s.fecha !== dia){
        dia = s.fecha; cont = el('div','dia');
        const dc = el('div','dia-cab'); dc.append(el('h3', null, mayus(largo(s.fecha))));
        const rel = relativo(s.fecha); if (rel) dc.append(el('span','rel', rel));
        cont.append(dc); sec.append(cont);
      }
      cont.append(tarjeta(s));
    });
    return sec;
  }
  const menor = (a,b) => a<b? a:b;
  const fin = s => largo(iso(add(parse(s),-1)));
  app.append(bloque('Esta semana', 'Del '+largo(hoyISO)+' al '+fin(L1)+'. Agenda cerrada.', hoyISO, L1, false));
  app.append(bloque('La próxima semana', 'Del '+largo(L1)+' al '+fin(menor(L2,F15))+'.', L1, menor(L2,F15), true));
  if (F15 > L2) app.append(bloque('Siguientes días', 'Del '+largo(L2)+' al '+fin(F15)+'.', L2, F15, true));

  // Radar: días 16 a 22, solo para choques
  const r3 = el('section','semana');
  const r3c = el('div','semana-cab'); r3c.append(el('h2', null, 'Más adelante'), el('p','sub','Del '+largo(F15)+' al '+fin(F22)+'.'));
  r3.append(r3c);
  const ss3 = sesiones(enRango(reales, F15, F22));
  if (!ss3.length) r3.append(el('p','vacio','Todavía no hay temas registrados para esos días.'));
  else { const ul=el('ul','radar'); ss3.forEach(s=>{ const li=el('li'); li.append(el('span','d', mayus(largo(s.fecha))), el('span',null, s.faro+': '+s.items.map(i=>i.tema).join('; '))); ul.append(li); }); r3.append(ul); }
  app.append(r3);

  const espera = (D.items||[]).filter(i=>!i.fecha).length;

  app.append(ley);

  // Glosario
  const g = el('section','box glosario'); g.setAttribute('aria-labelledby','t-glo');
  const gh = el('h2', null, 'Qué significa cada término'); gh.id='t-glo'; gh.style.fontSize='1.35rem';
  const dl = el('dl');
  [['FARO','Foro del equipo directivo para entender a fondo un reto estratégico, conversar y decidir. Sus miembros asisten siempre; otras personas, solo si un tema lo pide.'],
   ['NAVE','Equipo que ejecuta un frente de trabajo. Sus avances y el seguimiento de proyectos se ven en su propia sesión, no en el FARO.'],
   ['Capitán','Persona responsable de armar la agenda de un FARO o NAVE.'],
   ['Quórum','Se alcanza con la mitad más uno de capitán y miembros del FARO; los invitados no cuentan. Se muestra quién está convocado, qué respondió cada quien a la invitación y quiénes asisten como invitados recurrentes o especiales. Se alerta si el capitán rechaza o si ya no alcanzan las personas para el quórum.'],
   ['Prioridad 26-27','La prioridad institucional del ciclo 2026-2027 a la que contribuye el tema.'],
  ].forEach(([t,d])=>{ dl.append(el('dt',null,t), el('dd',null,d)); });
  g.append(gh, dl); app.append(g);

  // Anexo: decisiones previas aprobadas y juntas anteriores (ligas a Decisions), por FARO y NAVE
  const anx = D.anexo||[];
  if (anx.length){
    const sec = el('section','box anexo'); sec.setAttribute('aria-labelledby','t-anx');
    const h = el('h2', null, 'Anexo: decisiones previas y juntas anteriores'); h.id='t-anx'; h.style.fontSize='1.35rem';
    sec.append(h, el('p','sub','Contexto de cada FARO y NAVE. Las ligas de las juntas abren en Decisions con cuenta Tecmilenio.'));
    anx.forEach(x => {
      const d = el('div','anexo-faro'); const h3 = el('h3', null, x.faro); h3.id = 'anexo-'+slug(x.faro); d.append(h3);
      if (x.decisiones.length){ const ul=el('ul'); x.decisiones.forEach(y => { const li=el('li'); li.append(el('b',null,largo(y.fecha)+' · '+y.tema+': '), y.texto); ul.append(li); }); d.append(ul); }
      else d.append(el('p','dato','Sin decisiones previas registradas.'));
      if (x.juntas.length){
        const p = el('p','dato'); p.append(el('b',null,'Juntas anteriores: '));
        x.juntas.forEach((j,n) => { if (n) p.append(' · '); const txt = largo(j.fecha)+(j.minuta?' (con minuta)':''); if (j.url){ const a=el('a',null,txt); a.href=j.url; a.target='_blank'; a.rel='noopener'; p.append(a); } else p.append(txt); });
        d.append(p);
      } else d.append(el('p','dato', x.nave ? 'Sin minutas en Decisions: las NAVEs no se agendan ahí.' : 'Sin juntas anteriores en este ciclo.'));
      sec.append(d);
    });
    app.append(sec);
  }

  // Referencia: integrantes de cada FARO y NAVE, contacto para aclaraciones y Way of Work oficial (4-nov-2026, León)
  const ref = D.referencia;
  if (ref && (ref.roster||[]).length){
    const sec = el('section','box anexo'); sec.id='referencia'; sec.setAttribute('aria-labelledby','t-ref');
    const h = el('h2', null, 'Referencia: integrantes de cada FARO y NAVE'); h.id='t-ref'; h.style.fontSize='1.35rem';
    sec.append(h);
    const sub = el('p','sub','Capitanes e integrantes que cuentan para el quórum. ¿Alguna aclaración o cambio? Escriban a ');
    const ma = el('a',null,ref.contacto.nombre+' ('+ref.contacto.correo+')'); ma.href='mailto:'+ref.contacto.correo+'?subject='+encodeURIComponent('Integrantes de FAROs y NAVEs: aclaración o cambio'); sub.append(ma, '.');
    sec.append(sub);
    if (ref.wow_url){ const pw=el('p','dato'); const aw=el('a',null,'Way of Work: Playbook FAROs y NAVEs 2026 (versión oficial)'); aw.href=ref.wow_url; aw.target='_blank'; aw.rel='noopener noreferrer'; pw.append(aw); sec.append(pw); }
    ref.roster.forEach(x => {
      const d = el('div','anexo-faro'); d.append(el('h3', null, x.faro));
      const p = el('p','dato');
      if (x.capitanes.length){ p.append(el('b',null,(x.capitanes.length>1?'Capitanes: ':'Capitán: ')), x.capitanes.join(', ')+'. '); }
      p.append(el('b',null,'Integrantes: '), x.miembros.length ? x.miembros.join(', ')+'.' : 'sin registrar.');
      d.append(p); sec.append(d);
    });
    app.append(sec);
  }

  app.append(bc);

  // Pie
  const f = el('footer');
  if (espera){ const pe=el('p', null, espera+(espera===1?' tema más está':' temas más están')+' en lista de espera, sin fecha asignada.'); if (D.excel_url){ const ae=el('a',null,'Ver el Excel de agendas'); ae.href=D.excel_url; ae.target='_blank'; ae.rel='noopener'; pe.append(' ', ae, ' (requiere cuenta Tecmilenio).'); } f.append(pe); }
  f.append(el('p', null, '¿Falta un tema o cambió una fecha? Pídanlo al capitán del FARO o al equipo de León Velázquez antes del jueves.'));
  f.append(el('p', null, 'Se actualiza cada mañana. Siempre muestra los 15 días siguientes al día en que se abre.'));
  if (window.__pdfp){ f.append(window.__pdfp); }
  app.append(f);
  window.__AG = {nota, resumenBox: r, el, add, iso, largo, mayus, relativo, DIAS, HOY, sesCal, ses15, prox, prox_c, renglon, pct, tot, tarjeta, sesionCambio};
})();

<script>
/* Caja de comentarios: liga al Forms de mejoras (funciona sin cuenta de Claude).
   Las respuestas caen en OneDrive/Evaluación de satisfacción.xlsx. */
(function(){
  const app = document.getElementById('app');
  function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  const s = el('section','box mejora'); s.setAttribute('aria-labelledby','t-mej');
  const h = el('h2',null,'¿Cómo mejoramos esta página?'); h.id='t-mej';
  const a = el('a','copiar','Dejar un comentario');
  a.href = 'https://forms.cloud.microsoft/r/dEAv9EMyTv'; a.target = '_blank'; a.rel = 'noopener';
  s.append(h, el('p','sub','Cuéntennos qué les sirve, qué falta o qué confunde.'), a);
  const footer = app.querySelector('footer');
  if (footer) app.insertBefore(s, footer); else app.append(s);
})();
/* QR de comentarios: solo sale en el PDF (en pantalla vive la caja "¿Cómo mejoramos esta página?"). */
(function(){

<script>
/* Vista Resumen (28-oct-2026): mismas cifras y tarjetas que la agenda completa, en forma de tablero con búsqueda y filtros.
   Usa window.__AG que expone el script principal; si falta, la página queda como siempre. */
(function(){
  const A = window.__AG; if (!A) return;
  const app = document.getElementById('app'); const el = A.el;
  const norm = t => (t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const key = (f, fa) => f+'|'+fa;
  const header = app.querySelector('.top'); if (!header) return;

  // Selector de vista
  const bar = el('div','vista-bar'); bar.setAttribute('role','group'); bar.setAttribute('aria-label','Elegir vista');
  const bRes = el('button',null,'Resumen'), bCom = el('button',null,'Agenda completa');
  [bRes,bCom].forEach(b => b.type='button'); bar.append(bRes,bCom);
  const root = el('section','rs'); root.id='vista-resumen'; root.setAttribute('aria-label','Resumen de la agenda');
  header.after(bar); bar.after(root);

  // Filas: una por sesión del calendario; la tarjeta completa va dentro del desplegable
  const rows = A.sesCal.map(s => {
    const art = A.tarjeta(s); art.removeAttribute('id');
    const meta = (art.querySelector('.ses-meta')||{}).textContent || '';
    const qc = art.querySelector('details.quorum summary .chip');
    const qcls = qc ? qc.className : '';
    const vivos = s.items.filter(i => !i._retirado && !i._soloDec);
    const conf = s.items.some(i => i._conf);
    const nDec = vivos.filter(i => (i.tipo||'').toLowerCase()==='decisión').length;
    const esNave = /^nave/i.test(s.faro);
    const dq = art.querySelector('details.quorum'); if (dq){ dq.open = true;
      dq.querySelectorAll('.q-linea b').forEach(b => { if (b.textContent==='Aceptaron: ') b.textContent='Confirmados: '; else if (b.textContent==='Sin responder: ') b.textContent='Pendientes de confirmar: '; else if (b.textContent==='Tentativos: ') b.textContent='Tentativos (por confirmar): '; }); }
    const r = { s, k:key(s.fecha,s.faro), fecha:s.fecha, esNave,
      decide: nDec>0, alerta: !!art.querySelector('.ses-alerta'), cambio: !!A.sesionCambio(s),
      quorum: /c-alerta|c-tent/.test(qcls), hay: norm(art.textContent+' '+s.faro) };
    const det = el('details','rs-ses'+(esNave?' nave':''));
    const sm = el('summary');
    sm.append(el('span','rs-t', s.faro), el('span','rs-m', meta));
    const b = el('div','rs-b');
    const tag = (cls, txt) => b.append(el('span','rs-tag '+cls, txt));
    if (conf){ tag('bad','Acceso restringido'); if (s.items.some(i => i._conf && i._conf.reprogramar)) tag('warn', s.items.some(i => i._conf && i._conf.nueva_fecha) ? 'Reprogramada' : 'Cancelada por reprogramar'); }
    else if (!vivos.length) tag('', 'Sin temas');
    if (nDec) tag('dec', nDec===1 ? 'Se decide 1 tema' : 'Se deciden '+nDec+' temas');
    if (r.alerta) tag('bad','Alerta');
    if (r.cambio) tag('cam','Cambió');
    if (qc){ if (/c-alerta/.test(qcls)) tag('bad','Quórum en riesgo'); else if (/c-tent/.test(qcls)) tag('warn','Quórum por confirmar'); else if (/q-ok/.test(qcls)) tag('ok','Quórum alcanzado'); }
    sm.append(b);
    const cuerpo = el('div','rs-cuerpo'); cuerpo.append(art);
    det.append(sm, cuerpo);
    r.det = det;
    return r;
  });
  const byKey = new Map(rows.map(r => [r.k, r]));

  // Cifras: la caja original (cifras en línea y barra de decidir/opinar contra informar), sin cuadros
  const decisiones = A.prox.filter(i => (i.tipo||'').toLowerCase()==='decisión').length;
  const caja = A.resumenBox.cloneNode(true); caja.classList.add('rs-resumen');
  caja.querySelectorAll('[id]').forEach(x => x.removeAttribute('id')); caja.removeAttribute('aria-labelledby');
  const h2c = caja.querySelector('h2'); if (h2c) h2c.remove();

  // Herramientas: búsqueda, filtros, limpiar, cuenta
  const st = { q:'', tipo:'', flags:new Set(), dia:'' };
  const tools = el('div','rs-tools');
  const lab = el('label',null,'Buscar en la agenda'); lab.htmlFor='rs-q';
  const q = el('input','rs-q'); q.id='rs-q'; q.type='search'; q.placeholder='Tema, FARO o NAVE, responsable o persona'; q.autocomplete='off';
  const chips = el('div','rs-chips'); chips.setAttribute('role','group'); chips.setAttribute('aria-label','Filtros');
  const mk = (txt, on) => { const c = el('button','rs-chip',txt); c.type='button'; c.setAttribute('aria-pressed','false'); c.addEventListener('click', () => { on(c); apply(); }); chips.append(c); return c; };
  const tipoBtns = {};
  [['faro','FARO'],['nave','NAVE']].forEach(([v,t]) => { tipoBtns[v] = mk(t, c => { st.tipo = st.tipo===v ? '' : v; }); });
  const flagBtns = {};
  [['decide','Se decide'],['alerta','Con alerta'],['quorum','Quórum por confirmar'],['cambio','Con cambios']].forEach(([f,t]) => { flagBtns[f] = mk(t, c => { st.flags.has(f) ? st.flags.delete(f) : st.flags.add(f); }); });
  const clear = el('button','rs-clear','Quitar filtros'); clear.type='button';
  chips.append(clear);
  const cuenta = el('p','rs-cuenta'); cuenta.setAttribute('aria-live','polite');
  tools.append(lab, q, chips, cuenta);

  // Tira de 15 días
  const dias = el('div','rs-dias'); dias.setAttribute('role','group'); dias.setAttribute('aria-label','Filtrar por día');
  const diaBtns = [];
  for (let i=0;i<15;i++){
    const d = A.add(A.HOY, i), f = A.iso(d), n = rows.filter(r => r.fecha===f).length;
    const b = el('button','rs-dia'+(i===0?' hoy':'')); b.type='button'; b.setAttribute('aria-pressed','false'); b.disabled = !n;
    b.setAttribute('aria-label', A.mayus(A.largo(f))+': '+n+(n===1?' sesión':' sesiones'));
    b.append(el('small',null,A.DIAS[d.getDay()].slice(0,3)), el('b',null,String(d.getDate())), el('i',null,n?String(n):'·'));
    b.addEventListener('click', () => { st.dia = st.dia===f ? '' : f; apply(); });
    b.dataset.f = f; dias.append(b); diaBtns.push(b);
  }

  // Lista por día
  const main = el('div','rs-main');
  const grupos = new Map();
  rows.forEach(r => {
    if (!grupos.has(r.fecha)){
      const h = el('div','rs-dh'); h.append(el('h3',null,A.mayus(A.largo(r.fecha))));
      const rel = A.relativo(r.fecha); if (rel) h.append(el('span','rs-rel',rel));
      grupos.set(r.fecha, {h, rows:[]}); main.append(h);
    }
    grupos.get(r.fecha).rows.push(r); main.append(r.det);
  });
  const vacio = el('div','rs-vacio'); vacio.hidden = true;
  vacio.append(el('p',null,'Ninguna sesión coincide con la búsqueda y los filtros. Quite un filtro o pruebe con otra palabra.'));
  main.append(vacio);

  // Panel lateral: para decidir y qué cambió
  const aside = el('aside','rs-aside');
  const ir = k => { const r = byKey.get(k); if (!r) return; reset(); apply(); r.det.open = true; r.det.scrollIntoView({block:'start'}); r.det.querySelector('summary').focus({preventScroll:true}); };
  const panel = (tit, lista, vacioTxt) => {
    const p = el('section','rs-panel'); p.append(el('h2',null,tit));
    if (!lista.length){ p.append(el('p','rs-vacio',vacioTxt)); return p; }
    const ul = el('ul','rs-lista');
    lista.forEach(([k, a, b]) => { const li = el('li'); const bt = el('button','rs-link'); bt.type='button'; bt.append(el('b',null,a), b); bt.addEventListener('click', () => ir(k)); li.append(bt); ul.append(li); });
    p.append(ul); return p;
  };
  const dec = A.prox.filter(i => (i.tipo||'').toLowerCase()==='decisión').map(i => [key(i.fecha,i.faro), i.tema, i.faro+' · '+A.mayus(A.largo(i.fecha))]);
  aside.append(panel('Para decidir', dec, 'Sin temas para decidir en estos días.'));
  const pCamb = panel('Qué cambió', A.prox_c.map(c => [key(c.fecha,c.faro), c.faro, A.renglon(c)]), 'Sin cambios en la agenda de los próximos días.');
  // Botón para copiar la nota de cambios (la que se pega en WhatsApp): mismo texto y mismo comportamiento que en la agenda completa
  const bn = el('button','rs-chip','Copiar nota de cambios'); bn.type='button';
  const tn = el('textarea','nota-copia'); tn.value = A.nota; tn.readOnly = true; tn.hidden = true; tn.setAttribute('aria-label','Nota de cambios para compartir');
  bn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(A.nota); bn.textContent = 'Nota copiada'; }
    catch(e){ tn.hidden = false; tn.focus(); tn.select(); bn.textContent = 'Seleccionada: copie con Ctrl+C o Cmd+C'; }
    setTimeout(() => { bn.textContent = 'Copiar nota de cambios'; }, 4000);
  });
  pCamb.append(bn, tn);
  aside.append(pCamb);

  const cols = el('div','rs-cols'); cols.append(main, aside);
  root.append(el('h2',null,'Los próximos 15 días'), caja, tools, dias, cols,
    el('p','rs-pie','Rojo y ámbar marcan alertas y pendientes. La agenda completa trae el detalle de cada tema y el anexo de decisiones previas.'));

  // Filtrado
  let hubo = false;
  function reset(){ st.q=''; st.tipo=''; st.flags.clear(); st.dia=''; q.value=''; }
  function apply(){
    const toks = norm(st.q).split(/\s+/).filter(Boolean);
    let n = 0;
    rows.forEach(r => {
      const ok = (!st.tipo || (st.tipo==='nave')===r.esNave) && (!st.dia || r.fecha===st.dia)
        && [...st.flags].every(f => r[f]) && toks.every(t => r.hay.includes(t));
      r.det.hidden = !ok; r.ok = ok; if (ok) n++;
    });
    if (toks.length){ rows.forEach(r => { if (r.ok) r.det.open = n<=4; }); hubo = true; }
    else if (hubo){ rows.forEach(r => { r.det.open = false; }); hubo = false; }
    grupos.forEach(g => { g.h.hidden = !g.rows.some(r => r.ok); });
    vacio.hidden = n>0;
    cuenta.textContent = 'Mostrando '+n+' de '+rows.length+(rows.length===1?' sesión.':' sesiones.');
    Object.entries(tipoBtns).forEach(([v,b]) => b.setAttribute('aria-pressed', String(st.tipo===v)));
    Object.entries(flagBtns).forEach(([f,b]) => b.setAttribute('aria-pressed', String(st.flags.has(f))));
    diaBtns.forEach(b => b.setAttribute('aria-pressed', String(st.dia===b.dataset.f)));
    clear.hidden = !(toks.length || st.tipo || st.flags.size || st.dia);
  }
  q.addEventListener('input', () => { st.q = q.value; apply(); });
  clear.addEventListener('click', () => { reset(); apply(); q.focus(); });

  // Vista inicial: Resumen, salvo que el link traiga un ancla de la agenda completa
  function vista(v){
    const res = v==='resumen';
    document.body.classList.toggle('rs-on', res); root.hidden = !res;
    bRes.setAttribute('aria-pressed', String(res)); bCom.setAttribute('aria-pressed', String(!res));
  }
  bRes.addEventListener('click', () => vista('resumen'));
  bCom.addEventListener('click', () => vista('completa'));
  apply();
  vista(/^#(s-|anexo-|cambios|vista-completa)/.test(location.hash) ? 'completa' : 'resumen');
  if (location.hash && !/^#hoy-/.test(location.hash)){ const t = document.getElementById(location.hash.slice(1)); if (t) setTimeout(() => t.scrollIntoView(), 0); }
})();
</script>

(function(){try{
  var D=JSON.parse(document.getElementById('datos').textContent), u=D.pages_url;
  if(!u||/github\.io$/.test(location.hostname)||/^(localhost|127\.|)$/.test(location.hostname)||location.protocol==='file:') return;
  var b=document.createElement('div'); b.setAttribute('role','note');
  b.style.cssText='background:#00534C;color:#fff;padding:12px 16px;font:700 14px/20px Corbel,Candara,"Segoe UI",sans-serif;text-align:center';
  var a=document.createElement('a'); a.href=u; a.textContent=u; a.style.cssText='color:#26D07C;word-break:break-all';
  b.appendChild(document.createTextNode('La agenda oficial está en: ')); b.appendChild(a);
  document.body.insertBefore(b,document.body.firstChild);
}catch(e){}})();
</script>
